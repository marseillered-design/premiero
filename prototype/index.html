<title>Premiero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: календарь премьер как программка кинозала; лента по дням, фильтры сбоку, регион и язык сверху. Палитра общая с MovieMood */
:root{
  --bg:#F3EBDF; --surface:#FBF6EE; --surface-2:#E9DCCB; --line:#DCCBB2; --fg:#2B1D14; --muted:#7A6656;
  --accent:#8A6020; --accent-ink:#FBF6EE; --accent-soft:rgba(184,134,59,.16);
  --buy:#DC2626; --buy-ink:#FFFFFF;
  --t-cinema:#8A6020; --t-series:#9A5A2E; --t-online:#C42525;
  --ok:#3F7D4F; --seat:#D9C8B0; --overlay:rgba(43,29,20,.45);
  --shadow:0 18px 50px rgba(43,29,20,.18);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120C09; --surface:#1B130E; --surface-2:#251A13; --line:#3A2A1D; --fg:#F5EDE3; --muted:#A8968A;
    --accent:#E8C27A; --accent-ink:#1B130E; --accent-soft:rgba(232,194,122,.14);
    --buy:#E50914; --buy-ink:#FFFFFF;
    --t-cinema:#E8C27A; --t-series:#C47A45; --t-online:#F0605A;
    --ok:#7CC48F; --seat:#3A2A1D; --overlay:rgba(0,0,0,.7);
    --shadow:0 18px 50px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120C09; --surface:#1B130E; --surface-2:#251A13; --line:#3A2A1D; --fg:#F5EDE3; --muted:#A8968A;
  --accent:#E8C27A; --accent-ink:#1B130E; --accent-soft:rgba(232,194,122,.14);
  --buy:#E50914; --buy-ink:#FFFFFF;
  --t-cinema:#E8C27A; --t-series:#C47A45; --t-online:#F0605A;
  --ok:#7CC48F; --seat:#3A2A1D; --overlay:rgba(0,0,0,.7);
  --shadow:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;max-width:11em;line-height:1.2}
.bulbs{display:grid;grid-template-columns:repeat(3,5px);gap:3px}
.bulbs i{width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.bulbs i:nth-child(2n){opacity:.45;box-shadow:none}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.nav button{padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.search{flex:1 1 200px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none}
.search svg{flex:none;color:var(--muted)}
.region{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.region select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:46vw}
.demo{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:4px 8px}

/* ---------- toolbar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .sw{width:8px;height:8px;border-radius:50%}
.month-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.month-nav h2{font-family:var(--display);font-weight:700;font-size:17px;min-width:9.5em;text-align:center}
.icon-btn{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--muted)}
.today-btn{padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.views{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.views button{width:38px;height:34px;display:grid;place-items:center;color:var(--muted);background:var(--surface)}
.views button+button{border-left:1px solid var(--line)}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.bar-note{color:var(--muted);font-size:14px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:22px 60px}
.side{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:22px}
.side h3{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.genres{display:flex;flex-wrap:wrap;gap:6px}
.genres .chip{font-size:13px;padding:5px 10px}
.toggles{display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.reset{font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.side-note{font-size:13px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:16px}

.summary{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:18px;color:var(--muted);font-size:14px}
.summary b{color:var(--fg);font-family:var(--mono);font-weight:600}
.summary .k{display:inline-flex;align-items:center;gap:6px}
.summary .sw{width:8px;height:8px;border-radius:50%}

/* ---------- feed ---------- */
.day{scroll-margin-top:130px;margin-bottom:34px}
.day-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.day-h h2{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap}
.day-h .wd{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-left:6px}
.day-h .rel{font-size:13px;color:var(--accent);white-space:nowrap}
.day-h .rule{flex:1;height:1px;background:var(--line);align-self:center;min-width:12px}
.day-h .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.day.is-today .day-h h2{color:var(--accent)}
.day.is-past{opacity:.72}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:22px 18px}
.card{display:flex;flex-direction:column;gap:9px;min-width:0}
.poster-btn{display:block;border-radius:8px;transition:transform .18s ease}
.poster-btn:hover{transform:translateY(-3px)}
.card-t{font-size:15px;font-weight:600;line-height:1.25}
.card-t button{text-align:left}
.card-t button:hover{color:var(--accent)}
.card-m{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.card-a{display:flex;gap:6px;align-items:center;margin-top:auto}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:5px;white-space:nowrap}
.t-cinema{--tc:var(--t-cinema)} .t-series{--tc:var(--t-series)} .t-online{--tc:var(--t-online)}
.tag{color:var(--tc);background:color-mix(in srgb,var(--tc) 15%,transparent)}
.watch{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border-radius:8px;background:var(--surface-2);font-family:var(--mono);font-size:12px;color:var(--muted)}
.watch[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.watch[aria-pressed="true"] svg{fill:currentColor}
.buy{height:30px;padding:0 11px;border-radius:8px;background:var(--buy);color:var(--buy-ink);font-size:13px;font-weight:600;white-space:nowrap}
.buy:hover{filter:brightness(1.08)}
.buy.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.buy.ghost:hover{border-color:var(--muted);filter:none}

/* ---------- poster ---------- */
.poster{container-type:inline-size;position:relative;aspect-ratio:2/3;width:100%;max-width:100%;border-radius:8px;overflow:hidden;background:linear-gradient(165deg,var(--p1),var(--p2));color:var(--pi);isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.poster::before,.poster::after{content:"";position:absolute;z-index:-1}
.p-t{position:absolute;left:8%;right:8%;bottom:9%;font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:1.03;letter-spacing:-.01em;overflow-wrap:break-word}
.p-lg{font-size:12.5cqw} .p-md{font-size:10cqw} .p-sm{font-size:8.2cqw} .p-xs{font-size:6.8cqw}
.p-top{position:absolute;left:8%;right:26%;top:7%;font-family:var(--mono);font-size:5cqw;letter-spacing:.05em;text-transform:uppercase;opacity:.85;line-height:1.25}
.p-age{position:absolute;right:6%;top:6%;font-family:var(--mono);font-weight:600;font-size:5.4cqw;border:.5cqw solid currentColor;border-radius:1.6cqw;padding:.4cqw 1.4cqw;opacity:.9}
.poster.mini span{display:none}
.v0::before{width:64%;aspect-ratio:1;left:18%;top:19%;border-radius:50%;background:var(--p3);opacity:.92}
.v0::after{left:0;right:0;top:50%;bottom:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--p2) 75%,transparent),var(--p2))}
.v1::before{inset:0;background:repeating-linear-gradient(118deg,transparent 0 9cqw,color-mix(in srgb,var(--p3) 45%,transparent) 9cqw 11cqw)}
.v1::after{left:0;right:0;top:45%;bottom:0;background:linear-gradient(transparent,var(--p2) 70%)}
.v2::before{width:150%;aspect-ratio:1;left:-25%;top:-32%;border-radius:50%;background:repeating-radial-gradient(circle at center,color-mix(in srgb,var(--p3) 55%,transparent) 0 1.2cqw,transparent 1.2cqw 7cqw)}
.v2::after{left:0;right:0;top:50%;bottom:0;background:linear-gradient(transparent,var(--p2) 70%)}
.v3::before{left:14%;width:22%;top:0;bottom:0;background:var(--p3);opacity:.85;box-shadow:36cqw 0 0 0 color-mix(in srgb,var(--p3) 40%,transparent)}
.v3::after{left:0;right:0;top:46%;bottom:0;background:linear-gradient(transparent,var(--p2) 75%)}
.v4::before{inset:0;background:radial-gradient(circle,var(--p3) 0 1.6cqw,transparent 1.8cqw) 0 0/9cqw 9cqw;opacity:.55;-webkit-mask:linear-gradient(#000 15%,transparent 72%);mask:linear-gradient(#000 15%,transparent 72%)}
.v4::after{width:46%;aspect-ratio:1;right:-8%;top:22%;border:2.4cqw solid var(--p3);border-radius:50%}

/* ---------- month grid ---------- */
.month{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.month .wdh{background:var(--surface);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.cell{background:var(--bg);min-height:128px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell.out{background:color-mix(in srgb,var(--bg) 55%,var(--surface-2))}
.cell.out .cell-d{opacity:.4}
.cell-d{align-self:flex-start;font-family:var(--mono);font-size:13px;font-weight:600;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.cell-d:hover{background:var(--surface-2)}
.cell.today .cell-d{background:var(--accent);color:var(--accent-ink)}
.cell ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;min-width:0}
.m-ev{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:2px 4px 2px 2px;border-radius:6px;font-size:12px;line-height:1.2;min-width:0}
.m-ev:hover{background:var(--surface-2)}
.m-ev .poster{width:20px;flex:none;border-radius:3px}
.m-ev .m-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.m-ev .m-t::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tc);margin-right:5px;vertical-align:1px}
.more{font-size:12px;color:var(--accent);text-align:left;padding:2px 4px}
.dots{display:none;flex-wrap:wrap;gap:3px;padding:0 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--tc)}

/* ---------- list ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.date{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
td.date small{display:block;color:var(--muted);font-size:11px}
.l-title{display:flex;align-items:center;gap:10px;font-weight:600;text-align:left}
.l-title .poster{width:30px;flex:none;border-radius:4px}
.l-title:hover{color:var(--accent)}
td.muted{color:var(--muted)}

/* ---------- cinemas ---------- */
.cin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cin{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cin h3{font-family:var(--display);font-size:17px;font-weight:700}
.cin .addr{font-size:13px;color:var(--muted)}
.fmts{display:flex;flex-wrap:wrap;gap:5px}
.fmt{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
.fmt.hi{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.cin .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:6px}
.cin .stat{font-size:13px;color:var(--muted)}
.cin .stat b{color:var(--fg);font-family:var(--mono)}
.thumbs{display:flex;gap:4px;min-height:45px}
.thumbs .poster{width:30px;border-radius:3px}

.show-past{display:flex;width:100%;justify-content:center;margin-bottom:22px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--fg);font-size:16px}

/* ---------- dialog ---------- */
dialog{width:100%;max-width:min(980px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:var(--overlay)}
.m-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.m-head .crumb{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-body{padding:22px 24px 28px;display:flex;flex-direction:column;gap:26px}
.m-title{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1.15;letter-spacing:-.02em}
.m-sub{color:var(--muted);margin-top:6px}
.hero{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;align-items:start}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.1;letter-spacing:-.02em;margin:8px 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:14px;margin-bottom:14px}
.meta span{white-space:nowrap}
.desc{font-size:16px;line-height:1.55;max-width:62ch;margin-bottom:14px}
.credits{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px;margin-bottom:18px}
.credits b{color:var(--fg);font-weight:500}
.hero-a{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.btn.primary{background:var(--buy);color:var(--buy-ink);border-color:var(--buy)}
.btn[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent-soft)}
.btn[aria-pressed="true"] svg{fill:currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sec h3{font-family:var(--display);font-weight:700;font-size:17px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.rel-table{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rel-c{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px}
.rel-c b{display:block;font-family:var(--mono);font-size:13px;font-weight:600;margin-top:2px}
.rel-c.cur{border-color:var(--accent);background:var(--accent-soft)}
.rel-c .na{color:var(--muted);font-weight:400}
.datestrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.ds{flex:none;display:flex;flex-direction:column;align-items:center;min-width:58px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.ds b{font-family:var(--mono);font-size:17px;color:var(--fg);font-weight:600}
.ds[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ds[aria-pressed="true"] b{color:var(--bg)}
.venues{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.venue{display:grid;grid-template-columns:minmax(180px,240px) minmax(0,1fr);gap:14px;padding:14px 16px;align-items:start}
.venue+.venue{border-top:1px solid var(--line)}
.venue h4{margin:0;font-size:15px;font-weight:600}
.venue h4 button:hover{color:var(--accent)}
.venue .addr{font-size:12.5px;color:var(--muted);margin-top:2px}
.sess{display:flex;flex-wrap:wrap;gap:8px}
.ses{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);min-width:84px;text-align:left}
.ses:hover{border-color:var(--accent)}
.ses .tm{font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.ses .fx{font-size:11px;color:var(--muted)}
.ses .pr{font-family:var(--mono);font-size:12px;color:var(--accent)}
.ses.past{opacity:.4;pointer-events:none}

const ITEMS = [];
function baseItem(src, type){
  const r = rng(src.id);
  const it = { ...src, type, v: hash(src.id + 'v') % 5, pop: 30 + Math.floor(r() * 960) };
  it.dir = person(r);
  it.cast = [person(r), person(r), person(r)];
  return it;
}
CINEMA.forEach(s => {

  it.dates = {};
  for (const c of Object.keys(COUNTRIES)){
    const r = rng(s.id + c);

    else if (c === 'mx') off = r() < .3 ? -7 : 0;
    else if (c === 'kz') off = r() < .2 ? 7 : 0;
    else if (c === 'by') off = r() < .35 ? 7 : 0;
    else if (c === 'uz') { na = r() < .15; off = r() < .5 ? 7 : 14; }
    else if (c === 'am' || c === 'kg') { na = r() < .15; off = r() < .5 ? 0 : 7; }
    it.dates[c] = na ? null : addDays(base, off);
  }
  ITEMS.push(it);
});

    if (!it.drops[idx]) it.drops[idx] = { date: addDays(it.date, idx * 7), eps: [] };
    it.drops[idx].eps.push(e);
  }
  ITEMS.push(it);
});
const BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const GENRES = (() => { const c = {}; ITEMS.forEach(i => i.g.forEach(g => c[g] = (c[g] || 0) + 1)); return Object.keys(c).sort((a, b) => c[b] - c[a]); })();
const TYPE_ORDER = { cinema:0, online:1, series:2 };
const title = it => tx(it.t);
const genreList = it => it.g.map(g => tx(GENRE[g])).join(', ');
const rating = it => (RATING[state.country] || {})[it.age] || it.age;
function byline(it){
  if (it.type === 'cinema') return `${t('dir_pre')} ${initials(it.dir)}`;
  if (it.type === 'online') return t('only_on', it.plat);

}

/* ===================== cinemas & sessions ===================== */
const CIN_NAMES = ['Lumen','Orbit','Vista','Nova Screen','Prism','Reel House','Spotlight','Frame','Silver Hall','Zenith','Marquee','Arcade'];
const MALLS = ['Atrium','Galaxy','Riviera','Central','Parkside','Grand','Quarter','Harbor','Horizon','Meridian'];
const EXTRA_FMT = ['3D','IMAX','Dolby Atmos','4DX','VIP'];
const FMT_MULT = { '2D':1, '3D':1.2, 'IMAX':1.6, 'Dolby Atmos':1.3, '4DX':1.9, 'VIP':2.4 };
const SLOTS = ['09:40','10:30','11:15','12:20','13:10','14:00','15:30','16:20','17:45','18:30','19:20','20:10','21:00','21:50','22:40','23:30'];
const cinCache = {};
function cinemasFor(cityId){
  if (cinCache[cityId]) return cinCache[cityId];
  const r = rng('city:' + cityId);
  const n = CITY_SIZE[cityId] || 4;
  const names = [...CIN_NAMES].sort(() => r() - .5).slice(0, n);
  const malls = [...MALLS].sort(() => r() - .5);
  return cinCache[cityId] = names.map((name, i) => ({
    id: hash(cityId + name).toString(36), name, city: cityId,
    mall: malls[i % malls.length],
    halls: 4 + Math.floor(r() * 9),
    formats: ['2D', ...EXTRA_FMT.filter(() => r() < .42)],
  }));
}
const venue = cin => t('venue', cin.mall);
function ticketState(it, c){
  if (it.type !== 'cinema') return 'none';
  const d = it.dates[c]; if (!d) return 'tba';
  const n = diffDays(d, TODAY);
  if (n > 21) return 'soon'; if (n > 0) return 'presale'; if (n >= -34) return 'on'; return 'ended';
}
const hasTickets = (it, c) => ['on','presale'].includes(ticketState(it, c));
const SESS = new Map();
function money(v, c){ const C = COUNTRIES[c]; return new Intl.NumberFormat(LOC[L], { style:'currency', currency:C.cur, minimumFractionDigits:C.dec, maximumFractionDigits:C.dec }).format(v); }
function sessionsFor(it, cin, date, c){
  if (!hasTickets(it, c)) return [];
  const rel = it.dates[c];
  if (date < rel || diffDays(date, rel) > 34) return [];
  const r = rng(it.id + cin.id + dkey(date));
  const pop = it.pop / 1000;
  if (r() > .4 + pop * .55) return [];
  const slots = SLOTS.filter(s => !(it.age === '0+' && s > '21') && !(it.age === '18+' && s < '12'));
  const count = Math.min(slots.length, 1 + Math.floor(r() * (2 + pop * 4)));
  const chosen = [...slots].sort(() => r() - .5).slice(0, count).sort();
  const C = COUNTRIES[c];
  return chosen.map(time => {
    const fmt = r() < .55 ? '2D' : pick(cin.formats, r);
    let p = C.base;
    const h = parseInt(time, 10);
    if (h < 12) p *= .7; else if (h >= 18 && h < 22) p *= 1.25;
    if ([0, 5, 6].includes(date.getDay())) p *= 1.12;
    p *= FMT_MULT[fmt] * (.92 + r() * .16);
    const s = {
      id: `${it.id}|${cin.id}|${dkey(date)}|${time}`, it, cin, date, time, fmt, c,
      price: Math.max(C.round, Math.round(p / C.round) * C.round),
      hall: 1 + Math.floor(r() * cin.halls),
    };
    SESS.set(s.id, s);
    return s;
  });
}
const isPastSession = s => diffDays(s.date, TODAY) === 0 && (parseInt(s.time, 10) * 60 + parseInt(s.time.slice(3), 10)) < NOW_MIN;

L = store.get('premiero.lang', null) || COUNTRIES[state.country].lang;

const cityName = id => { for (const c of Object.values(COUNTRIES)) { const x = c.cities.find(y => y.id === id); if (x) return tx(x); } return id; };

/* ===================== events ===================== */
function allEvents(){
  const ev = [];
  for (const it of ITEMS){
    if (it.type === 'cinema'){ const d = it.dates[state.country]; if (d) ev.push({ it, date: d, kind: 'release' }); }
    else if (it.type === 'online') ev.push({ it, date: it.date, kind: 'release' });
    else it.drops.forEach((dr, i) => ev.push({ it, date: dr.date, kind: i === 0 ? 'premiere' : 'episode', eps: dr.eps, final: dr.eps.includes(it.eps) }));
  }
  return ev;
}
function passes(ev){
  const it = ev.it;
  if (state.cat !== 'all' && it.type !== state.cat) return false;
  if (state.genres.size && !it.g.some(g => state.genres.has(g))) return false;
  if (state.onlyWatch && !watch.has(it.id)) return false;
  if (state.onlyTickets && !hasTickets(it, state.country)) return false;
  if (!state.showEpisodes && ev.kind === 'episode') return false;
  if (state.q && !Object.values(it.t).some(v => v.toLowerCase().includes(state.q))) return false;
  return true;
}
function monthEvents(){
  const m = state.month;
  return allEvents().filter(e => e.date.getFullYear() === m.getFullYear() && e.date.getMonth() === m.getMonth() && passes(e))
    .sort((a, b) => a.date - b.date || TYPE_ORDER[a.it.type] - TYPE_ORDER[b.it.type] || b.it.pop - a.it.pop);
}
function epLabel(ev){
  if (!ev.eps) return '';
  const a = ev.eps[0], b = ev.eps[ev.eps.length - 1];
  const base = a === b ? `${ev.it.season}×${String(a).padStart(2,'0')}` : t('eps_range', a, b);
  if (ev.kind === 'premiere') return ev.eps.length === ev.it.eps ? t('full_season') : `${t('premiere')}, ${base}`;
  return ev.final ? `${base}, ${t('finale')}` : base;
}

function poster(it, cls = ''){

function summaryLine(evs){
  const c = { cinema: 0, series: 0, online: 0 };
  const seen = new Set();
  evs.forEach(e => { if (!seen.has(e.it.id)){ seen.add(e.it.id); c[e.it.type]++; } });
  const part = (k, n) => n ? `<span class="k"><span class="sw" style="background:var(--t-${k})"></span><b>${n}</b> ${t('s_' + k, n)}</span>` : '';
  return `<div class="summary">${part('cinema', c.cinema)}${part('series', c.series)}${part('online', c.online)}</div>`;

const emptyState = () => `<div class="empty"><b>${t('empty_t')}</b><span>${t('empty_s')}</span><button class="btn" data-act="reset">${t('reset')}</button></div>`;
const isCurMonth = () => state.month.getFullYear() === TODAY.getFullYear() && state.month.getMonth() === TODAY.getMonth();
function renderFeed(all){
  if (!all.length) return emptyState();
  // в текущем месяце лента начинается с позавчера, ранние дни свёрнуты
  const cut = addDays(TODAY, -2);
  const evs = isCurMonth() && !state.showPast ? all.filter(e => e.date >= cut) : all;
  const hidden = all.length - evs.length;
  const days = new Map();
  evs.forEach(e => { const k = dkey(e.date); if (!days.has(k)) days.set(k, []); days.get(k).push(e); });
  let html = summaryLine(all);
  if (hidden) html += `<button class="btn show-past" data-act="show-past">${t('show_past', hidden)}</button>`;
  for (const [k, list] of days){
    const d = fromKey(k), n = diffDays(d, TODAY);

      <header class="day-h"><h2>${fmtDate(d)}<span class="wd">${fmtWd(d)}</span></h2><span class="rel">${relLabel(d)}</span><span class="rule"></span><span class="cnt">${t('releases_n', list.length)}</span></header>

function renderMonthGrid(evs){
  const first = state.month;

  const weeks = Math.ceil((lead + dim) / 7);
  const start = addDays(first, -lead);
  const byDay = {};
  evs.forEach(e => (byDay[dkey(e.date)] ||= []).push(e));
  let html = summaryLine(evs) + '<div class="month">';
  for (let i = 0; i < 7; i++) html += `<div class="wdh">${fmtWd(addDays(start, i), 'short')}</div>`;
  for (let i = 0; i < weeks * 7; i++){
    const d = addDays(start, i), k = dkey(d), list = byDay[k] || [];
    const out = d.getMonth() !== first.getMonth();
    html += `<div class="cell ${out ? 'out' : ''} ${diffDays(d, TODAY) === 0 ? 'today' : ''}">

  if (!modal.open){ modal.showModal(); document.body.style.overflow = 'hidden'; }
  modal.scrollTop = 0;
  if (opts.tickets){ const el = $('#tickets', modal); if (el) requestAnimationFrame(() => el.scrollIntoView({ block: 'start' })); }
}
modal.addEventListener('close', () => { document.body.style.overflow = ''; });
modal.addEventListener('click', e => { if (e.target === modal) modal.close(); });
function head(crumb, back){
  return `<div class="m-head">${back ? `<button class="icon-btn" data-back="${back}" aria-label="${esc(t('back'))}">${ICON.prev}</button>` : ''}<span class="crumb">${crumb}</span><button class="icon-btn" data-close aria-label="${esc(t('close'))}">${ICON.close}</button></div>`;
}
function dateStrip(from, days, sel){
  let h = `<div class="datestrip" role="group" aria-label="${esc(t('date_l'))}">`;
  for (let i = 0; i < days; i++){
    const d = addDays(from, i), k = dkey(d), n = diffDays(d, TODAY);
    const lbl = n === 0 ? t('today_s') : n === 1 ? t('tomorrow_s') : fmtWd(d, 'short');
    h += `<button class="ds" data-date="${k}" aria-pressed="${k === sel}"><span>${lbl}</span><b>${d.getDate()}</b><span>${fmtMonShort(d)}</span></button>`;
  }
  return h + '</div>';
}
function sessBtn(s){
  return `<button class="ses ${isPastSession(s) ? 'past' : ''}" data-session="${esc(s.id)}" aria-label="${s.time}, ${s.fmt}, ${t('hall')} ${s.hall}, ${t('from')} ${money(s.price, s.c)}"><span class="tm">${s.time}</span><span class="fx">${s.fmt} · ${t('hall')} ${s.hall}</span><span class="pr">${t('from')} ${money(s.price, s.c)}</span></button>`;
}
function renderFilm(it){
  const c = state.country;
  const st = ticketState(it, c);
  const on = watch.has(it.id);
  const metaBits = [it.type === 'series' ? `${t('season')} ${it.season}, ${t('eps_n', it.eps)}` : `${it.dur} ${t('min')}`, rating(it), genreList(it)];
  let h = head(`${t('ty_' + it.type)} · ${esc(title(it))}`) + `<div class="m-body">
    <div class="hero">
      ${poster(it)}
      <div>
        <span class="tag t-${it.type}">${t('ty_' + it.type)}${it.plat ? ' · ' + esc(it.plat) : ''}</span>
        <h2 id="m-title">${esc(title(it))}</h2>
        <div class="meta">${metaBits.map(b => `<span>${esc(b)}</span>`).join('')}</div>
        <p class="desc">${esc(tx(it.d))}</p>
        <div class="credits"><span>${t('director')}: <b>${esc(it.dir)}</b></span><span>${t('cast')}: <b>${esc(it.cast.join(', '))}</b></span></div>
        <div class="hero-a">
          ${st === 'on' || st === 'presale' ? `<button class="btn primary" data-act="to-tickets">${st === 'on' ? t('buy') : t('buy_pre')}</button>` : ''}
          ${it.type !== 'cinema' ? `<button class="btn primary" data-act="watch-online" data-plat="${esc(it.plat)}">${ICON.play} ${esc(t('watch_on', it.plat))}</button>` : ''}
          <button class="btn" data-act="trailer">${ICON.play} ${t('trailer')}</button>
          <button class="btn" data-watch="${it.id}" aria-pressed="${on}">${ICON.bell} <span>${on ? t('in_list') : t('want')}</span></button>
        </div>
      </div>
    </div>`;

  if (it.type === 'cinema'){
    h += `<section class="sec"><h3>${t('rel_dates')} <small>${t('by_country')}</small></h3><div class="rel-table">${Object.keys(COUNTRIES).map(k => {
      const d = it.dates[k];
      return `<div class="rel-c ${k === c ? 'cur' : ''}">${esc(countryName(k))}<b>${d ? fmtDate(d) : `<span class="na">${t('tba')}</span>`}</b></div>`; }).join('')}</div></section>`;
    h += `<section class="sec" id="tickets"><h3>${t('showtimes')} <small>${esc(cityName(state.city))}</small></h3>`;
    if (st === 'on' || st === 'presale'){
      const rel = it.dates[c];
      const from = rel > TODAY ? rel : TODAY;
      const sel = M.date && fromKey(M.date) >= from ? M.date : dkey(from);
      M.date = sel;
      const day = fromKey(sel);
      h += dateStrip(from, 7, sel);
      const rows = cinemasFor(state.city).map(cin => ({ cin, ss: sessionsFor(it, cin, day, c) })).filter(r => r.ss.length);
      h += rows.length ? `<div class="venues">${rows.map(({ cin, ss }) => `<div class="venue"><div><h4><button data-cinema="${cin.id}">${esc(cin.name)}</button></h4><p class="addr">${esc(venue(cin))}</p></div><div class="sess">${ss.map(sessBtn).join('')}</div></div>`).join('')}</div>`
        : `<p class="note">${esc(t('no_sess', cityName(state.city)))}</p>`;
    } else if (st === 'soon') h += `<p class="note">${esc(t('soon_note', fmtDate(it.dates[c])))}</p>`;
    else if (st === 'tba') h += `<p class="note">${esc(t('tba_note', countryName(c)))}</p>`;
    else h += `<p class="note">${t('ended_note')}</p>`;
    h += '</section>';
  }
  if (it.type === 'online'){
    h += `<section class="sec"><h3>${cap(t('premiere'))}</h3><p class="note">${esc(t('online_note', fmtDate(it.date), relLabel(it.date), it.plat))}</p></section>`;
  }
  if (it.type === 'series'){
    h += `<section class="sec"><h3>${t('ep_sched')} <small>${esc(it.plat)} · ${t('season')} ${it.season}</small></h3><div class="eps">${it.drops.map(dr => {
      const out = dr.date <= TODAY;
      const a = dr.eps[0], b = dr.eps[dr.eps.length - 1];
      return `<div class="ep ${out ? 'out' : ''}"><span class="n">${a === b ? `${it.season}×${String(a).padStart(2,'0')}` : `${a}–${b}`}</span><span>${a === b ? t('ep_one', a) : t('eps_one', a, b)}${dr.eps.includes(it.eps) ? ' · ' + t('season_finale') : ''}</span><span class="d">${out ? t('out') + ' · ' : ''}${fmtDate(dr.date)}</span></div>`; }).join('')}</div></section>`;
  }
  return h + '</div>';
}
function renderCinema(cin){
  const c = state.country;
  const sel = M.date || dkey(TODAY); M.date = sel;
  const day = fromKey(sel);
  const rows = ITEMS.filter(it => it.type === 'cinema').map(it => ({ it, ss: sessionsFor(it, cin, day, c) })).filter(r => r.ss.length)
    .sort((a, b) => b.it.pop - a.it.pop);
  return head(`${t('cinema_w')} · ${esc(cin.name)}`) + `<div class="m-body">
    <div>
      <h2 id="m-title" class="m-title">${esc(cin.name)}</h2>
      <p class="m-sub" style="margin-bottom:12px">${esc(venue(cin))}, ${esc(cityName(cin.city))} · ${t('halls_n', cin.halls)}</p>
      <div class="fmts">${cin.formats.map(f => `<span class="fmt ${f !== '2D' ? 'hi' : ''}">${f}</span>`).join('')}</div>
    </div>
    <section class="sec"><h3>${t('schedule')}</h3>${dateStrip(TODAY, 7, sel)}
      ${rows.length ? `<div class="venues">${rows.map(({ it, ss }) => `<div class="film-row"><button data-open="${it.id}" aria-label="${esc(t('open', title(it)))}">${poster(it)}</button><div><h4><button data-open="${it.id}">${esc(title(it))}</button><small>${esc(rating(it))} · ${it.dur} ${t('min')}</small></h4><div class="sess">${ss.map(sessBtn).join('')}</div></div></div>`).join('')}</div>`
        : `<p class="note">${t('no_sess_s')}</p>`}
    </section>
  </div>`;
}
function hallLayout(s){
  const r = rng(s.id + ':hall');
  const rows = 8 + Math.floor(r() * 5);
  const per = 12 + 2 * Math.floor(r() * 4);
  const busy = .25 + s.it.pop / 2600 + (parseInt(s.time, 10) >= 18 ? .12 : 0);
  const taken = new Set();
  for (let y = 1; y <= rows; y++) for (let x = 1; x <= per; x++) if (r() < busy) taken.add(`${y}-${x}`);
  return { rows, per, taken };
}
const seatPrice = (s, row, rows) => row === rows ? Math.round(s.price * 1.4 / COUNTRIES[s.c].round) * COUNTRIES[s.c].round : s.price;
function seatsTotal(){ const s = M.session, H = hallLayout(s); let sum = 0; M.seats.forEach(k => { sum += seatPrice(s, +k.split('-')[0], H.rows); }); return sum; }
function seatsText(){
  const by = {};
  [...M.seats].map(k => k.split('-').map(Number)).sort((a, b) => a[0] - b[0] || a[1] - b[1]).forEach(([y, x]) => (by[y] ||= []).push(x));
  return Object.entries(by).map(([y, xs]) => `${t('row')} ${y}, ${t('seat_w', xs.length)} ${xs.join(', ')}`).join('; ');
}
const sessLine = s => `${fmtDate(s.date)}, ${fmtWd(s.date, 'short')}, ${s.time}`;
function renderSeats(){
  const s = M.session, H = hallLayout(s);
  const half = H.per / 2;
  const cols = `22px repeat(${half}, 24px) 14px repeat(${half}, 24px) 22px`;
  let grid = '';
  for (let y = 1; y <= H.rows; y++){
    grid += `<span class="rn">${y}</span>`;
    for (let x = 1; x <= H.per; x++){
      if (x === half + 1) grid += '<span class="aisle"></span>';
      const k = `${y}-${x}`, taken = H.taken.has(k);
      grid += `<button class="seat ${y === H.rows ? 'comfort' : ''}" data-seat="${k}" aria-pressed="${M.seats.has(k)}" ${taken ? 'disabled' : ''} aria-label="${esc(t('seat_l', y, x))}${taken ? t('taken_s') : ''}">${x}</button>`;
    }
    grid += `<span class="rn">${y}</span>`;
  }
  const n = M.seats.size;
  return head(`${esc(title(s.it))} · ${esc(s.cin.name)} · ${sessLine(s)}`, 'info') + `<div class="m-body">
    <div><h2 id="m-title" class="m-title">${t('seats_t')}</h2>
    <p class="m-sub">${esc(s.cin.name)}, ${t('hall')} ${s.hall} · ${s.fmt} · ${sessLine(s)}</p></div>
    <div class="hall-wrap"><div class="screen">${t('screen')}</div><div class="hall" style="grid-template-columns:${cols}">${grid}</div>
    <div class="legend"><span><i></i>${t('free')} · ${money(s.price, s.c)}</span><span><i class="lc"></i>${t('comfort')} · ${money(seatPrice(s, H.rows, H.rows), s.c)}</span><span><i class="ls"></i>${t('selected')}</span><span><i class="lt"></i>${t('taken')}</span></div></div>
  </div>
  <div class="checkout"><div class="sel">${n ? `${seatsText()}<b>${money(seatsTotal(), s.c)}</b>` : t('seat_hint')}</div><button class="btn primary" data-step="pay" ${n ? '' : 'disabled'}>${t('cont')}</button></div>`;
}
function summaryBox(){
  const s = M.session;
  return `<div class="sum-box">${poster(s.it)}<dl>
    <dt>${t('f_film')}</dt><dd>${esc(title(s.it))}, ${esc(rating(s.it))}</dd>
    <dt>${t('f_cinema')}</dt><dd>${esc(s.cin.name)}, ${esc(venue(s.cin))}</dd>
    <dt>${t('f_session')}</dt><dd>${sessLine(s)} · ${t('hall')} ${s.hall} · ${s.fmt}</dd>
    <dt>${t('f_seats')}</dt><dd>${seatsText()}</dd>
    <dt>${t('f_total')}</dt><dd style="font-family:var(--mono);font-weight:600">${money(seatsTotal(), s.c)}</dd>
  </dl></div>`;
}
function renderPay(){
  const s = M.session;
  return head(`${esc(title(s.it))} · ${t('checkout_c')}`, 'seats') + `<div class="m-body">
    <h2 id="m-title" class="m-title">${t('how_buy')}</h2>
    ${summaryBox()}
    <div class="pay-opts">
      <div class="opt main"><h4>${t('pay_t')}</h4><p>${t('pay_d')}</p><button class="btn primary" data-step="done">${t('pay_b')} · ${money(seatsTotal(), s.c)}</button></div>
      <div class="opt"><h4>${t('partner_t')}</h4><p>${t('partner_d')}</p><button class="btn" data-act="partner">${t('partner_b')}</button></div>
    </div>
    <p class="note">${t('proto')}</p>
  </div>`;
}
function renderDone(){
  const s = M.session;
  const code = (hash(s.id + [...M.seats].join()) % 900000 + 100000).toString();
  return head(t('ticket'), null) + `<div class="m-body">
    <div class="ticket">
      <div class="main">
        <span class="tag t-cinema">${t('demo_ticket', code)}</span>
        <h3 id="m-title">${esc(title(s.it))}</h3>
        <span class="ln"><b>${fmtDate(s.date)}, ${s.time}</b> · ${fmtWd(s.date)}</span>
        <span class="ln">${esc(s.cin.name)}, ${esc(venue(s.cin))} · <b>${t('hall')} ${s.hall}</b> · ${s.fmt}</span>
        <span class="ln"><b>${seatsText()}</b></span>
        <span class="ln">${t('paid')}: <b>${money(seatsTotal(), s.c)}</b></span>
      </div>
      <div class="stub"><canvas id="qr" width="25" height="25" aria-label="${esc(t('qr'))}"></canvas><small>${code}</small></div>
    </div>
    <p class="done-note">${t('done_note')}</p>
    <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"><button class="btn" data-close>${t('close')}</button><button class="btn primary" data-back="info">${t('other_sess')}</button></div>
  </div>`;
}
function drawQR(seed){
  const cv = $('#qr'); if (!cv) return;
  const x = cv.getContext('2d'), r = rng(seed), N = 25;
  x.fillStyle = '#fff'; x.fillRect(0, 0, N, N); x.fillStyle = '#111';
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (r() < .5) x.fillRect(i, j, 1, 1);
  const finder = (ox, oy) => { x.fillStyle = '#fff'; x.fillRect(ox - 1, oy - 1, 9, 9); x.fillStyle = '#111'; x.fillRect(ox, oy, 7, 7); x.fillStyle = '#fff'; x.fillRect(ox + 1, oy + 1, 5, 5); x.fillStyle = '#111'; x.fillRect(ox + 2, oy + 2, 3, 3); };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);
}
function renderModal(){
  let html;
  if (M.step === 'seats') html = renderSeats();
  else if (M.step === 'pay') html = renderPay();
  else if (M.step === 'done') html = renderDone();
  else html = M.ctx.kind === 'film' ? renderFilm(BY_ID[M.ctx.id]) : renderCinema(cinemasFor(state.city).find(c => c.id === M.ctx.id));
  modal.innerHTML = html;
  modal.setAttribute('aria-labelledby', 'm-title');
  if (M.step === 'done') drawQR(M.session.id);
}

/* ===================== interactions ===================== */
let toastT;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200); }
function toggleWatch(id){
  if (watch.has(id)) watch.delete(id); else watch.add(id);
  store.set('premiero.watch', [...watch]);
  const it = BY_ID[id], on = watch.has(id);
  document.querySelectorAll(`[data-watch="${id}"]`).forEach(b => {
    b.setAttribute('aria-pressed', on);
    const sp = b.querySelector('span');
    if (b.classList.contains('watch')){ sp.textContent = watchCount(it); b.setAttribute('aria-label', on ? t('unwant') : t('want')); }
    else sp.textContent = on ? t('in_list') : t('want');
  });
  toast(on ? t('added', title(it)) : t('removed', title(it)));
  if (state.onlyWatch) render(); else renderSide();
}
function shiftMonth(n){
  if (n === 0){ state.month = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); state.showPast = false; }
  else state.month = new Date(state.month.getFullYear(), state.month.getMonth() + n, 1);
  render(n === 0);
  if (n !== 0) window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
}
function rerenderModalKeepScroll(){ const top = modal.scrollTop; renderModal(); modal.scrollTop = top; }

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  if (d.watch) return toggleWatch(d.watch);
  if (d.open) return openModal({ kind: 'film', id: d.open }, { tickets: d.tab === 'tickets' });
  if (d.cinema) return openModal({ kind: 'cinema', id: d.cinema });
  if (d.close !== undefined) return modal.close();
  if (d.page){ state.page = d.page; render(); window.scrollTo({ top: 0 }); return; }
  if (d.cat){ state.cat = d.cat; return render(); }
  if (d.view){ state.view = d.view; store.set('premiero.view', d.view); return render(); }
  if (d.month !== undefined) return shiftMonth(+d.month);
  if (d.genre){ state.genres.has(d.genre) ? state.genres.delete(d.genre) : state.genres.add(d.genre); return render(); }
  if (d.day){ state.showPast = true; state.view = 'feed'; store.set('premiero.view', 'feed'); render(); return scrollToDay(d.day, true); }
  if (d.date){ M.date = d.date; return rerenderModalKeepScroll(); }
  if (d.session){ M.session = SESS.get(d.session); M.seats = new Set(); M.step = 'seats'; renderModal(); modal.scrollTop = 0; return; }
  if (d.seat){
    if (M.seats.has(d.seat)) M.seats.delete(d.seat);
    else if (M.seats.size >= 6) return toast(t('max6'));
    else M.seats.add(d.seat);
    const hl = modal.querySelector('.hall-wrap')?.scrollLeft || 0;
    rerenderModalKeepScroll();
    const hw = modal.querySelector('.hall-wrap'); if (hw) hw.scrollLeft = hl;
    modal.querySelector(`[data-seat="${d.seat}"]`)?.focus({ preventScroll: true });
    return;
  }
  if (d.step){ M.step = d.step; renderModal(); modal.scrollTop = 0; return; }
  if (d.back){ M.step = d.back; if (d.back === 'info') M.seats = new Set(); renderModal(); modal.scrollTop = 0; return; }
  switch (d.act){
    case 'show-past': state.showPast = true; render(); break;
    case 'reset': state.genres.clear(); state.onlyTickets = state.onlyWatch = false; state.showEpisodes = true; state.q = ''; $('#q').value = ''; render(); break;
    case 'to-tickets': $('#tickets', modal)?.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' }); break;
    case 'trailer': toast(t('t_trailer')); break;
    case 'watch-online': toast(t('t_online', d.plat)); break;
    case 'partner': toast(t('t_partner')); break;
  }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'f-tickets'){ state.onlyTickets = e.target.checked; render(); }
  if (id === 'f-watch'){ state.onlyWatch = e.target.checked; render(); }
  if (id === 'f-eps'){ state.showEpisodes = e.target.checked; render(); }
  if (id === 'country'){
    state.country = v; state.city = COUNTRIES[v].cities[0].id;
    if (!store.get('premiero.lang', null)) L = COUNTRIES[v].lang;   // язык следует за страной, пока его не выбрали вручную
    saveRegion(); render();
  }
  if (id === 'city'){ state.city = v; saveRegion(); render(); }
  if (id === 'lang'){ L = v; store.set('premiero.lang', v); render(); if (modal.open) rerenderModalKeepScroll(); }
});
let qT;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); state.page = 'calendar'; render(); }, 150); });
function saveRegion(){ store.set('premiero.region', { country: state.country, city: state.city }); }

render();
if (location.hash && BY_ID[location.hash.slice(1)]) openModal({ kind: 'film', id: location.hash.slice(1) });
</script>
